<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Revise</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-header {
            margin-bottom: 32px;
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .profile-info {
            flex-grow: 1;
        }

        .profile-username {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .profile-bio {
            color: var(--text-muted);
            margin-bottom: 16px;
            font-size: 15px;
            line-height: 1.5;
        }

        .profile-stats {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-weight: 600;
            font-size: 18px;
            font-family: 'Clash Display', sans-serif;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-end;
        }

        .profile-tabs {
            display: flex;
            gap: 32px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            padding: 0 24px;
        }

        .tab-item {
            padding: 12px 0;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            position: relative;
            transition: color var(--transition-fast);
        }

        .tab-item:hover {
            color: var(--text-main);
        }

        .tab-item.active {
            color: var(--primary);
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
            box-shadow: 0 -2px 10px var(--primary-glow);
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                justify-content: center;
                margin-bottom: 16px;
            }

            .profile-actions {
                align-items: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar glass-panel">
            <div class="sidebar-header">
                <i class="ph-fill ph-student glow-icon"></i>
                <h1 class="brand">Revise</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item"><i class="ph ph-house"></i><span>Accueil</span></a></li>
                <li><a href="explore.html" class="nav-item"><i class="ph ph-compass"></i><span>Explorer</span></a></li>
                <li><a href="profile.html" class="nav-item active"><i class="ph ph-user"></i><span>Profil</span></a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div style="display: flex; align-items:center; gap: 12px;">
                    <a href="index.html" class="icon-btn"><i class="ph ph-arrow-left"></i></a>
                    <h2>Profil</h2>
                </div>
            </header>

            <div class="profile-header glass-panel">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Loading" alt="Avatar" class="profile-avatar"
                    id="profAvatar">

                <div class="profile-info">
                    <h1 class="profile-username" id="profUsername">Chargement...</h1>
                    <p class="profile-bio" id="profBio">...</p>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-value" id="profPostsCount">0</span>
                            <span class="stat-label">Posts</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="profFollowersCount">0</span>
                            <span class="stat-label">Abonnés</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="profFollowingCount">0</span>
                            <span class="stat-label">Abonnements</span>
                        </div>
                    </div>
                </div>

                <div class="profile-actions" id="profActions">
                    <!-- Dynamic: Follow button or Edit Profile based on user -->
                    <button class="btn btn-primary" id="followBtn" style="display:none;">
                        <i class="ph ph-user-plus"></i> S'abonner
                    </button>
                    <button class="btn btn-outline" id="editProfileBtn" style="display:none;">
                        <i class="ph ph-pencil-simple"></i> Modifier
                    </button>
                </div>
            </div>

            <div class="profile-tabs">
                <div class="tab-item active">Publications</div>
                <div class="tab-item">Sauvegardes</div>
            </div>

            <div class="feed-container" id="profilePostsContainer">
                <p style="text-align:center; color: var(--text-muted); padding: 40px;">Chargement des posts...</p>
            </div>

        </main>

        <aside class="right-panel">
            <!-- Included purely for layout balance -->
        </aside>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>

</html>
